[package]
name = "ipc"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# The two backends are independent, non-exclusive feature flags. `bek` and
# `ipc-channel-backend` can both be enabled in one binary (the backend is
# chosen per-extension at runtime); with neither enabled the crate fails to
# compile on macOS and iOS with a compile_error in `src/backend.rs`.
default = ["ipc-channel-backend"]
# ipc-channel transport for ALL extensions (net, media, content).
ipc-channel-backend = []
# BrowserEngineKit backend: the OS launches extension processes via
# NetworkingProcess/WebContentProcess/RenderingProcess and the transport is
# libxpc (`IpcTransport::Xpc`). Compiles on any target; launching is only
# possible on iOS/iPadOS, where BrowserEngineKit exists (see `bek-sys`).
bek = ["dep:bek-sys"]

[dependencies]
crossbeam-channel = "0.5"
log = "0.4"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }

# Always available: content uses ipc-channel when not using ipc-channel-backend
# (see Module docs in backend.rs).
ipc-channel = { git = "https://github.com/gterzian/ipc-channel", rev = "169da83" }

# xpc-sys wraps the libxpc layer used by the `bek` backend's `Xpc` transport
# (and, on macOS, still provides the launchd primitives). The crate is a
# no-op stub off Apple targets.
xpc-sys = { path = "xpc-sys" }

# bek-sys links the BrowserEngineKit Swift shim (iOS targets only; off-iOS it
# is a compile-only stub). Only pulled in when the `bek` feature is enabled.
bek-sys = { path = "bek-sys", optional = true }

[lib]
path = "src/lib.rs"
