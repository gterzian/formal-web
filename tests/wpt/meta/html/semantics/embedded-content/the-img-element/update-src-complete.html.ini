[update-src-complete.html]
  disabled: Spec conflict: the test asserts `img.complete` is false synchronously after setting `src`. Per https://html.spec.whatwg.org/#update-the-image-data, step 8 queues a microtask and step 18 installs the new request (state `unavailable`, https://html.spec.whatwg.org/#updating-the-image-data:img-none) inside that microtask, so before the microtask checkpoint the current request is still completely available and the pending request is null, and `complete` returns true. The synchronous false result the test expects is the on-demand behavior described in https://html.spec.whatwg.org/#when-to-obtain-images (the current request's state must return to unavailable when the element has experienced relevant mutations), not the immediate-obtaining behavior this implementation follows. Re-enable if the implementation is changed to report `complete` false while an update is queued, or if the test is aligned with the algorithm's microtask split.
