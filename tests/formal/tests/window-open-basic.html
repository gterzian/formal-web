<!DOCTYPE html>
<meta charset="utf-8">
<title>window.open basic test</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
'use strict';

// Test 1: window.open('', '_blank') returns a Window object
test(() => {
  const w = window.open('', '_blank');
  assert_not_equals(w, null, 'window.open should not return null for non-noopener');
  assert_equals(typeof w, 'object', 'return value should be an object');
  assert_equals(typeof w.open, 'function', 'returned object should have open method');
  // Close the popup so it doesn't accumulate
  if (w) w.close();
}, 'window.open _blank returns Window');

// Test 2: window.open with noopener returns null
test(() => {
  const w = window.open('', '_blank', 'noopener=yes');
  assert_equals(w, null, 'window.open with noopener should return null');
}, 'window.open with noopener returns null');

// Test 3: window.open('', '_self') returns current window
test(() => {
  const w = window.open('', '_self');
  assert_equals(w, window, 'window.open _self should return current window');
}, 'window.open _self returns current window');

// Test 4: Empty url with _self does not navigate the window away
test(() => {
  const w = window.open('', '_blank');
  assert_not_equals(w, null, 'popup opened');
  // An empty url is a null urlRecord, and step 16.1 of the window open steps
  // navigates only when urlRecord is non-null, so calling open with an empty
  // url and _self must not replace whichever window _self resolves to (the
  // source window).  Reaching this line intact proves it.
  const w2 = w.open('', '_self');
  assert_not_equals(w2, null, 'empty url _self returns a window');
  assert_equals(typeof w2.open, 'function', 'result should be a Window');
  if (w) w.close();
}, 'empty url _self does not navigate the source away');

// Test 5: Cross-origin navigation should throw
test(() => {
  const w = window.open('', '_blank');
  assert_not_equals(w, null, 'popup opened');
  // The realm that creates the exception is not asserted: `open` is the
  // popup's own method, so a spec-correct implementation creates the
  // SecurityError in the popup's realm, and the engines this test runs on
  // disagree about which realm a cross-realm native call is entered in.
  try {
    w.open('https://example.com', '_self');
    assert_unreached('cross-origin navigation should throw');
  } catch (e) {
    assert_equals(typeof e, 'object', 'a DOMException object is thrown');
    assert_equals(e && e.constructor && e.constructor.name, 'DOMException', 'it is a DOMException');
    assert_equals(e.name, 'SecurityError', 'exception name');
    assert_equals(e.code, 18, 'SECURITY_ERR code');
  }
  w.close();
}, 'cross-origin window.open throws SecurityError');

</script>
