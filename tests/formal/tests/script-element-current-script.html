<!doctype html>
<meta charset="utf-8">
<title>HTMLScriptElement and document.currentScript</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="log"></div>
<script id="inline" type="text/javascript" data-x="1">
  window.__currentDuringInline = document.currentScript;
</script>
<script>
  test(() => {
    assert_true(window.__currentDuringInline instanceof HTMLScriptElement, "inline script sees itself");
    assert_equals(window.__currentDuringInline.id, "inline");
    assert_equals(document.currentScript.id, "", "the running script has no id");
    assert_true(document.currentScript instanceof HTMLScriptElement);
  }, "document.currentScript is the executing script element");

  test(() => {
    const scripts = document.getElementsByTagName("script");
    assert_true(scripts.length >= 3);
    assert_true(scripts[0] instanceof HTMLScriptElement);
    assert_equals(scripts[0].src, location.origin + "/resources/testharness.js", "src reflects as an absolute URL");
    assert_equals(scripts[2].src, "", "no src attribute reflects as the empty string");
  }, "HTMLScriptElement.src reflects the src attribute relative to the document");

  test(() => {
    const script = document.createElement("script");
    assert_true(script instanceof HTMLScriptElement);
    assert_false(script.async);
    script.async = true;
    assert_true(script.hasAttribute("async"));
    script.defer = true;
    assert_equals(script.getAttribute("defer"), "");
    script.defer = false;
    assert_false(script.hasAttribute("defer"));
    script.type = "module";
    assert_equals(script.getAttribute("type"), "module");
    script.src = "x.js";
    assert_equals(script.src, new URL("x.js", location.href).href);
    script.noModule = true;
    assert_true(script.noModule);
    assert_equals(document.getElementById("inline").text.trim(), "window.__currentDuringInline = document.currentScript;");
  }, "HTMLScriptElement reflects its attributes");

  async_test((t) => {
    const script = document.createElement("script");
    script.setAttribute("data-name", "dynamic");
    script.onload = t.step_func_done(() => {
      assert_equals(window.__dynamicScriptRan, 1, "the fetched script ran once");
      assert_equals(window.__dynamicScriptCurrent, "dynamic", "currentScript was the inserted element");
      assert_equals(document.currentScript, null, "currentScript is restored");
    });
    script.onerror = t.unreached_func("the script should load");
    script.src = "script-element-dynamic-resource.js";
    document.head.appendChild(script);
  }, "a script element inserted by script fetches and runs its src, then fires load");

  async_test((t) => {
    const script = document.createElement("script");
    script.onerror = t.step_func_done((event) => {
      assert_true(event instanceof Event);
      assert_equals(window.__missingRan, undefined);
    });
    script.onload = t.unreached_func("a missing script should not load");
    script.src = "does-not-exist.js";
    document.body.appendChild(script);
  }, "a script element whose src fails to fetch fires error");

  test(() => {
    const script = document.createElement("script");
    script.text = "";
    script.textContent = "window.__inlineDynamic = document.currentScript && document.currentScript.id;";
    script.id = "inline-dynamic";
    document.body.appendChild(script);
    assert_equals(window.__inlineDynamic, "inline-dynamic", "an inserted inline script runs at insertion");
    document.body.appendChild(script);
    assert_equals(window.__inlineDynamic, "inline-dynamic", "re-inserting does not run it again");
  }, "an inline script element inserted by script runs immediately, once");

  test(() => {
    assert_true(document.head instanceof HTMLElement);
    assert_equals(document.head.tagName, "HEAD");
    assert_equals(document.head.parentNode.tagName, "HTML");
  }, "document.head is the head element");
</script>
