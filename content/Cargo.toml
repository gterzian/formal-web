[package]
name = "content"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(boa_backend)', 'cfg(v8_backend)'] }

[features]
default = ["media", "v8"]
media = []

# Backend selection (mutually exclusive). V8 is the default.
# Boa available by passing --no-default-features --features boa,media.
boa = ["js_engine/boa", "dep:boa_engine", "dep:boa_gc"]
v8 = ["js_engine/v8"]

# Optional WebAssembly support (only meaningful with `boa` backend).
wasm = ["dep:wasmtime"]

[lib]
path = "src/main.rs"

[[bin]]
name = "formal-web-content"
path = "src/bin/content_process.rs"

[dependencies]
anyrender = { git = "https://github.com/DioxusLabs/anyrender", rev = "f749ad59226ddf0529eca739ad67c842a4f3bcb5", features = ["serde"] }
blitz-dom = { workspace = true, features = ["svg", "system-fonts"] }
blitz-paint = { workspace = true, features = ["svg"] }
blitz-traits = { workspace = true }
cssparser = "0.38"
data-url = "0.3"
html5ever = "0.40.1"
ipc = { path = "../ipc" }
ipc_messages = { path = "../ipc_messages" }
keyboard-types = "0.8"
kurbo = "0.13"
peniko = "0.6"
log = "0.4"
env_logger = "0.11"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
style = { version = "0.24.0", package = "stylo" }
style_dom = { version = "0.24.0", package = "stylo_dom" }
style_traits = { version = "0.24.0", package = "stylo_traits" }
crossbeam-channel = "0.5"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
xml5ever = "0.40.0"
verification = { path = "../verification" }

# js_engine is always needed; backend selection is via feature flags.
js_engine = { path = "../js_engine", default-features = false }

# Boa + Wasmtime: optional, pulled in by the "boa" feature.
boa_engine = { git = "https://github.com/boa-dev/boa", rev = "bea404d173bf74a64b7c7ae39b1bc2da639abeee", default-features = false, features = ["experimental"], optional = true }
boa_gc = { git = "https://github.com/boa-dev/boa", rev = "bea404d173bf74a64b7c7ae39b1bc2da639abeee", features = ["thin-vec", "boa_string"], optional = true }
wasmtime = { version = "45.0.2", optional = true }
