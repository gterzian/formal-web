<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Same-origin iframe child</title>
    <style>
      html, body { margin: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #eef3ff;
        color: #1a1a2e;
        padding: 0.75rem 1rem;
      }
      h2 { margin: 0 0 0.4rem; font-size: 1rem; }
      p { margin: 0.3rem 0; font-size: 0.85rem; color: #4a4a62; }
      img { display: block; margin-top: 0.5rem; border-radius: 0.4rem; }
    </style>
  </head>
  <body>
    <h2 id="child-heading">Same-origin iframe document</h2>
    <p>
      This document has its own realm, its own frame, and its own
      <code>&lt;img&gt;</code> layer. It shares the parent's content process
      because it is same-origin with it.
    </p>
    <p id="child-status">waiting for parent…</p>
    <img id="child-image" src="images/sunset.png" width="180" height="100" alt="Sunset" />
    <script>
      // The parent reads these through contentWindow, and pings this document
      // over postMessage: both work because the document is same-origin and
      // lives in the parent's content process.
      document.getElementById("child-heading").textContent =
        "Same-origin iframe document (" + location.href + ")";

      // The parent posts the content it wants shown; this document writes it
      // into its own body, so the change is drawn in this frame.
      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || data.type !== "content") {
          return;
        }
        document.body.style.background = data.background;
        document.getElementById("child-heading").textContent = data.heading;
        document.getElementById("child-status").textContent = data.text;
      });

      if (window.parent !== window) {
        window.parent.postMessage("ready", "*");
      }
    </script>
  </body>
</html>
