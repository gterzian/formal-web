[package]
name = "net"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[features]
default = []
# The WebRTC engine (`webrtc` crate on qrtc) hosted in this process; the
# `webrtc` feature of the root package turns it on together with the
# content-side RTCPeerConnection code.
webrtc = ["dep:webrtc"]
# The tokio/reqwest backend. On non-Apple platforms it is the default (and
# only) backend and reqwest is always compiled (see the target-specific
# dependency tables); on Apple it is opt-in.
tokio = ["dep:reqwest"]
# Apple URLSession backend (macOS/iOS only). Marker feature: the url_session_sys
# crate is always compiled on Apple (see the target-specific dependency
# tables), so this flag just selects the backend when the default
# (`url_session_default` from build.rs) is not what is wanted.
url_session = []

[lib]
path = "src/main.rs"

[[bin]]
name = "formal-web-net"
path = "src/bin/net_process.rs"

[dependencies]
ipc = { path = "../ipc" }
ipc_messages = { path = "../ipc_messages" }
webrtc = { path = "../webrtc", optional = true }
crossbeam-channel = "0.5"
mime_guess = "2"
log = "0.4"
env_logger = "0.11"
url = "2"
data-url = "0.3"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
uuid = { version = "1", features = ["serde", "v4"] }

# --- tokio/reqwest backend ---
# On non-Apple platforms, reqwest is always compiled (non-optional) — it is
# the only backend there. On Apple platforms, reqwest is optional — enabled
# by the tokio feature.
[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
# The URLSession backend is always available on Apple: the default backend
# (url_session_default from build.rs) and the feature share the same crate (url_session_sys).
url_session_sys = { path = "url_session_sys" }
