[package]
name = "webview"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["media"]
media = ["user_agent/media"]

[dependencies]
blitz-traits = { workspace = true }
ipc-channel = { git = "https://github.com/gterzian/ipc-channel", rev = "169da83" }
ipc_messages = { path = "../ipc_messages" }
keyboard-types = "0.7"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
user_agent = { path = "../user_agent", default-features = false }
log = "0.4"
verification = { path = "../verification" }
