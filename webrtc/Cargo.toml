[package]
name = "webrtc"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ipc = { path = "../ipc" }
ipc_messages = { path = "../ipc_messages" }
crossbeam-channel = "0.5"
log = "0.4"
# The engine: qrtc, a pure Rust WebRTC engine (str0m, RustCrypto) with hybrid
# post-quantum key agreement (X25519MLKEM768) for DTLS 1.3. Pure Rust
# throughout: RustCrypto for TURN over TLS, moduletto for ML-KEM. It is the
# only backend of this crate; the `webrtc` feature of the net and content
# crates decides whether the crate is built at all.
qrtc = { git = "https://github.com/crabnebula-dev/qrtc", branch = "main", default-features = false, features = ["turn-tls-rustcrypto", "pq-moduletto"] }
