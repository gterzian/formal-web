[package]
name = "js_engine"
version = "0.1.0"
edition = "2024"
publish = false
description = "ECMA-262 abstract operation trait — pure type vocabulary and engine abstraction."

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(boa_backend)', 'cfg(v8_backend)'] }

[features]
default = ["v8"]
boa = ["dep:boa_engine", "dep:boa_gc", "dep:serde_json"]
float16 = ["boa_engine/float16"]
v8 = ["dep:rusty_v8"]

[dependencies]
log = "0.4"
serde_json = { version = "1", optional = true }
boa_engine = { git = "https://github.com/boa-dev/boa", rev = "bea404d173bf74a64b7c7ae39b1bc2da639abeee", default-features = false, features = ["experimental"], optional = true }
boa_gc = { git = "https://github.com/boa-dev/boa", rev = "bea404d173bf74a64b7c7ae39b1bc2da639abeee", features = ["thin-vec", "boa_string"], optional = true }
js_engine_macros = { path = "../js_engine_macros" }
rusty_v8 = { package = "v8", version = "=150.1.0", optional = true }
